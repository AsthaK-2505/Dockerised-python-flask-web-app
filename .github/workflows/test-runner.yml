name: Test Self Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  test-runner:

    runs-on: self-hosted

    steps:
      - name: Show system information
        run: |
          echo "GitHub Actions is running on my laptop!"
          hostname
          docker --version

      - name: Test FLoCI
        run: |
          curl http://localhost:4566

name: Flask CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd:
    runs-on: self-hosted

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566

      ECR_REGISTRY: 000000000000.dkr.ecr.us-east-1.localhost:5100
      ECR_REPOSITORY: flask-app

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python3 --version

      - name: Create virtual environment
        run: |
          python3 -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Test Flask application
        run: |
          .venv/bin/python -c "from app import app; client = app.test_client(); response = client.get('/'); assert response.status_code == 200; print('Flask test passed!')"

      - name: Build Docker image
        run: |
          docker build -t flask-app:${{ github.sha }} .

      - name: Login to FLoCI ECR
        run: |
          aws ecr get-login-password \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --region "$AWS_DEFAULT_REGION" \
          | docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"

      - name: Tag Docker image
        run: |
          docker tag \
            flask-app:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Docker image to FLoCI ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Verify FLoCI Registry
        run: |
          curl -fsS http://localhost:5100/v2/flask-app/tags/list

      - name: Start Minikube
        run: |
          minikube start --driver=docker

      - name: Check Kubernetes cluster
        run: |
          kubectl get nodes

      - name: Load image into Minikube
        run: |
          minikube image load \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Apply Kubernetes configuration
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Update Kubernetes image
        run: |
          kubectl set image deployment/flask-app \
            flask-app=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/flask-app --timeout=120s

      - name: Show Kubernetes resources
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
